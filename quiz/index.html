<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Participant</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --md-sys-color-primary: #6750a4;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #eaddff;
      --md-sys-color-on-primary-container: #21005d;
      --md-sys-color-secondary-container: #e8def8;
      --md-sys-color-surface: #fffbfe;
      --md-sys-color-surface-container-low: #f7f2fa;
      --md-sys-color-surface-container: #f3edf7;
      --md-sys-color-surface-container-highest: #e6e0e9;
      --md-sys-color-on-surface: #1c1b1f;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-outline: #79747e;
      --md-sys-color-outline-variant: #cac4d0;
      --md-sys-color-success-container: #c4eed0;
      --md-sys-color-on-success-container: #072111;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;
      --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.08), 0 1px 2px 0 rgba(0,0,0,0.12);
      --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.10), 0 1px 2px 0 rgba(0,0,0,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: radial-gradient(circle at 10% 10%, #f9f5fd 0%, var(--md-sys-color-surface-container) 100%);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .m3-card {
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 28px;
      padding: 36px 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--md-elevation-2);
      animation: scaleIn 0.35s cubic-bezier(0.05, 0.7, 0.1, 1.0);
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .m3-progress-track {
      width: 100%;
      height: 6px;
      background-color: var(--md-sys-color-surface-container-highest);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .m3-progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--md-sys-color-primary);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.2, 0, 0, 1);
    }

    .display-small { font-size: 32px; font-weight: 700; line-height: 40px; }
    .headline-medium { font-size: 20px; font-weight: 700; line-height: 28px; }
    .body-medium { font-size: 14px; color: var(--md-sys-color-on-surface-variant); line-height: 20px; }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .m3-input-wrapper { margin: 24px 0 16px 0; }
    .m3-text-field {
      width: 100%;
      padding: 16px 18px;
      border: 1.5px solid var(--md-sys-color-outline);
      border-radius: 14px;
      font-size: 16px;
      color: var(--md-sys-color-on-surface);
      background: var(--md-sys-color-surface-container-low);
      outline: none;
      transition: all 0.2s;
    }
    .m3-text-field:focus {
      border-color: var(--md-sys-color-primary);
      background: var(--md-sys-color-surface);
      box-shadow: 0 0 0 3px var(--md-sys-color-primary-container);
    }

    .m3-btn-filled {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      border-radius: 20px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      box-shadow: var(--md-elevation-1);
      transition: all 0.2s;
      width: 100%;
    }
    .m3-btn-filled:hover { box-shadow: var(--md-elevation-2); transform: translateY(-1px); }
    .m3-btn-filled:active { transform: scale(0.98); }

    .choice-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 24px 0;
    }
    .m3-choice-card {
      background: var(--md-sys-color-surface-container-low);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      text-align: left;
    }
    .m3-choice-card:hover {
      background-color: var(--md-sys-color-secondary-container);
      border-color: var(--md-sys-color-primary);
      transform: translateX(4px);
    }
    .m3-choice-card .prefix-circle {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .status-hero {
      text-align: center;
      padding: 32px 16px;
      border-radius: 20px;
      margin: 16px 0;
      background: var(--md-sys-color-surface-container-low);
    }
    .status-icon { font-size: 56px; margin-bottom: 12px; }

    .hidden { display: none !important; }

    /* 긴급 경고 효과: 화면 전체 붉은 사이렌 필터 & 강렬한 진동 */
    body.time-warning::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.15) 0%, rgba(200, 0, 0, 0.45) 100%);
      pointer-events: none; /* 클릭 방해 금지 */
      z-index: 999;
      animation: sirenPulse 0.45s infinite alternate ease-in-out;
    }

    .m3-card.shake-warning {
      animation: intenseShake 0.18s infinite ease-in-out;
      border: 2px solid #ba1a1a !important;
      box-shadow: 0 0 30px rgba(220, 0, 0, 0.6), inset 0 0 15px rgba(220, 0, 0, 0.1) !important;
    }

    /* 보기 카드들까지 붉은 위기감 전파 */
    .shake-warning .m3-choice-card {
      border-color: rgba(186, 26, 26, 0.5);
      background-color: rgba(255, 218, 214, 0.35);
    }

    @keyframes sirenPulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.9; }
    }

    @keyframes intenseShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, 2px) rotate(-0.8deg); }
      40% { transform: translate(4px, -2px) rotate(0.8deg); }
      60% { transform: translate(-3px, -2px) rotate(-0.5deg); }
      80% { transform: translate(3px, 2px) rotate(0.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
  </style>
  </style>
</head>
<body>

  <div class="m3-card">
    <div class="m3-progress-track">
      <div class="m3-progress-bar" id="student-progress-bar"></div>
    </div>

    <!-- 1. 로그인/입장 화면 -->
    <div id="student-login">
      <span class="badge-pill" style="margin-bottom: 12px;"><span class="material-symbols-outlined">school</span> Participant</span>
      <h1 class="display-small">Quiz Time</h1>
      <p class="body-medium">세션에서 사용할 닉네임을 입력하세요.</p>

      <div class="m3-input-wrapper">
        <input type="text" id="player-nickname" class="m3-text-field" placeholder="당신의 닉네임" maxlength="12">
      </div>

      <button class="m3-btn-filled" onclick="joinGame()">
        퀴즈 참가하기 <span class="material-symbols-outlined">login</span>
      </button>
    </div>

    <!-- 2. 대기 화면 -->
    <div id="student-wait" class="hidden">
      <div class="status-hero">
        <div class="status-icon">⏳</div>
        <h2 class="headline-medium">발표자를 기다리는 중</h2>
        <p class="body-medium" style="margin-top: 8px;">진행자가 퀴즈를 시작하면 화면이 전환됩니다.</p>
      </div>
    </div>

    <!-- 3. 선택지 입력 화면 -->
    <div id="student-quiz" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span class="badge-pill">Select One</span>
        <span class="badge-pill" style="background-color: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container);">
          <span class="material-symbols-outlined" style="font-size: 16px;">timer</span>
          <span id="student-timer-text">8s</span>
        </span>
      </div>
      <h2 class="headline-medium" id="student-q-title">정답을 선택하세요</h2>
      
      <div class="choice-group">
        <button class="m3-choice-card" onclick="submitAnswer(0)">
          <span class="prefix-circle">A</span><span id="student-opt-0">선택지 1</span>
        </button>
        <button class="m3-choice-card" onclick="submitAnswer(1)">
          <span class="prefix-circle">B</span><span id="student-opt-1">선택지 2</span>
        </button>
        <button class="m3-choice-card" onclick="submitAnswer(2)">
          <span class="prefix-circle">C</span><span id="student-opt-2">선택지 3</span>
        </button>
        <button class="m3-choice-card" onclick="submitAnswer(3)">
          <span class="prefix-circle">D</span><span id="student-opt-3">선택지 4</span>
        </button>
      </div>
    </div>

    <!-- 4. 결과 및 피드백 화면 -->
    <div id="student-result" class="hidden">
      <div class="status-hero" id="student-hero-banner">
        <div class="status-icon" id="student-result-icon">📨</div>
        <h2 class="headline-medium" id="student-result-text">답안 제출 완료</h2>
        <p class="body-medium" id="student-score-info" style="margin-top: 6px;">진행자의 정답 공개를 기다려주세요.</p>
      </div>
    </div>
  </div>

  <script>
    const SoundManager = {
      sfxMenu: new Audio('메뉴.mp3'),
      sfxCorrect: new Audio('정답.mp3'),
      sfxWrong: new Audio('오답.mp3'),
      play(type) {
        let sound = this['sfx' + type.charAt(0).toUpperCase() + type.slice(1)];
        if (sound) {
          sound.currentTime = 0;
          sound.play().catch(() => {});
        }
      }
    };

    const firebaseConfig = {
      apiKey: "AIzaSyBnCJlp6JA4bEl7a8waxnBoJ8rC106URjE",
      authDomain: "tjdwlr1.firebaseapp.com",
      databaseURL: "https://tjdwlr1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tjdwlr1",
      storageBucket: "tjdwlr1.firebasestorage.app",
      messagingSenderId: "372877966634",
      appId: "1:372877966634:web:5977767092350f289e3253"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // localStorage 대신 sessionStorage를 사용하여 브라우저 탭마다 독립된 ID를 갖도록 함
    let myPlayerId = sessionStorage.getItem('m3_player_id');
    let myNickname = '';
    let hasAnsweredCurrentQ = false;
    let studentCountdown = null;

    // 참가 후 실수로 탭 닫기/새로고침 방지
    window.addEventListener('beforeunload', (e) => {
      if (myNickname) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    function initStudent() {
      db.ref('gameSession').on('value', snapshot => {
        const data = snapshot.val();
        // 아직 닉네임을 입력하고 참가하지 않았다면 화면을 바꾸지 않음
        if (!data || !myNickname) return;

        if (data.state === 'lobby') {
          // 호스트가 게임을 리셋했거나 방에 내 정보가 없으면 로그인 화면으로 완전 초기화
          if (!data.players || !data.players[myPlayerId]) {
            myNickname = '';
            hasAnsweredCurrentQ = false;
            document.getElementById('player-nickname').value = '';
            showScreen('student-login');
            return;
          }
          hasAnsweredCurrentQ = false;
          showScreen('student-wait');
        }
        else if (data.state === 'question') {
          const currentIdx = data.currentQIndex || 0;
          const totalQ = data.totalQuestions || 3;
          const progressPercent = ((currentIdx + 1) / totalQ) * 100;
          document.getElementById('student-progress-bar').style.width = `${progressPercent}%`;

          // 새 문제 시작 시 답변 플래그 리셋 및 호스트가 전송한 질문/보기 표시
          if (data.reveal === false && !hasAnsweredCurrentQ) {
            const qData = data.currentQuestionData;
            if (qData) {
              // 1. 질문 문항 텍스트 반영 (예: "Q1. 대한민국의 수도는 어디일까요?")
              document.getElementById('student-q-title').innerText = `Q${currentIdx + 1}. ${qData.q || ''}`;

              // 2. 보기 텍스트 반영
              if (qData.choices) {
                for (let i = 0; i < 4; i++) {
                  document.getElementById(`student-opt-${i}`).innerText = qData.choices[i] || '';
                }
              }
            }
            showScreen('student-quiz');
            enableChoices(true);

            // 호스트의 문제 출제 시각 기준 남은 시간 계산 및 타이머 시작
            if (studentCountdown) clearInterval(studentCountdown);
            const timeLimit = data.timeLimit || 8;
            const qStart = data.questionStartTime || Date.now();
            const timerEl = document.getElementById('student-timer-text');
            const cardEl = document.querySelector('.m3-card');

            // 경고 효과 초기화
            document.body.classList.remove('time-warning');
            cardEl.classList.remove('shake-warning');

            const updateTimer = () => {
              const elapsed = Math.floor((Date.now() - qStart) / 1000);
              const remaining = Math.max(0, timeLimit - elapsed);
              timerEl.innerText = `${remaining}s`;

              // 3초 이하이고 아직 답을 안 골랐을 때 경고 발동
              if (remaining <= 3 && remaining > 0 && !hasAnsweredCurrentQ) {
                document.body.classList.add('time-warning');
                cardEl.classList.add('shake-warning');
              } else {
                document.body.classList.remove('time-warning');
                cardEl.classList.remove('shake-warning');
              }

              if (remaining <= 0) {
                clearInterval(studentCountdown);
                document.body.classList.remove('time-warning');
                cardEl.classList.remove('shake-warning');
                // 시간 초과 시 선택지 잠금
                if (!hasAnsweredCurrentQ) {
                  enableChoices(false);
                }
              }
            };
            updateTimer();
            studentCountdown = setInterval(updateTimer, 500);
          }
        } 
        else if (data.state === 'reveal') {
          if (studentCountdown) clearInterval(studentCountdown);
          document.body.classList.remove('time-warning');
          document.querySelector('.m3-card').classList.remove('shake-warning');
          showScreen('student-result');
          checkMyResult(); // 파라미터 불필요
        }
      });
    }

    function joinGame() {
      const input = document.getElementById('player-nickname');
      const name = input.value.trim();
      if (!name) {
        input.focus();
        return;
      }
      SoundManager.play('menu');
      myNickname = name;

      // 탭별로 고유한 플레이어 ID 생성 및 저장
      if (!myPlayerId) {
        myPlayerId = 'p_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
        sessionStorage.setItem('m3_player_id', myPlayerId);
      }

      db.ref(`gameSession/players/${myPlayerId}`).set({
        name: myNickname,
        score: 0,
        lastAnswer: null
      });

      // 참가 완료 후 대기 화면으로 진입 및 리스너 활성화
      showScreen('student-wait');
      initStudent();
    }

    function submitAnswer(choiceIndex) {
      SoundManager.play('menu');
      hasAnsweredCurrentQ = true;
      enableChoices(false);

      // 답안 제출 시 경고 애니메이션 즉시 해제
      document.body.classList.remove('time-warning');
      document.querySelector('.m3-card').classList.remove('shake-warning');

      db.ref(`gameSession/players/${myPlayerId}`).update({
        lastAnswer: choiceIndex,
        submittedAt: Date.now() // 동점자 처리를 위한 제출 시각(타임스탬프)
      });

      const hero = document.getElementById('student-hero-banner');
      hero.style.background = 'var(--md-sys-color-surface-container-low)';
      document.getElementById('student-result-icon').innerText = '📨';
      document.getElementById('student-result-text').innerText = '답안 제출 완료!';
      document.getElementById('student-result-text').style.color = 'var(--md-sys-color-on-surface)';
      document.getElementById('student-score-info').innerText = '진행자가 결과를 공개할 때까지 잠시 대기하세요.';
      showScreen('student-result');
    }

    function checkMyResult() {
      db.ref(`gameSession/players/${myPlayerId}`).once('value', snap => {
        const me = snap.val();
        if (!me) return;

        const earned = me.roundEarnedScore || 0;
        const hero = document.getElementById('student-hero-banner');
        const icon = document.getElementById('student-result-icon');
        const text = document.getElementById('student-result-text');

        const myAns = me.lastAnswer;

        // 1. 시간 초과로 답안을 제출하지 못한 경우 (전용 화면)
        if (myAns === null || myAns === undefined) {
          SoundManager.play('wrong');
          hero.style.background = 'var(--md-sys-color-surface-container-highest)';
          icon.innerText = '⏰';
          text.innerText = '시간 초과!';
          text.style.color = 'var(--md-sys-color-on-surface)';
        }
        // 2. 정답을 맞힌 경우
        else if (earned > 0) {
          SoundManager.play('correct');
          if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 60, origin: { y: 0.65 } });
          hero.style.background = 'var(--md-sys-color-success-container)';
          icon.innerText = '🎉';
          text.innerText = `정답입니다! (+${earned.toLocaleString()} pts)`;
          text.style.color = 'var(--md-sys-color-on-success-container)';
        } 
        // 3. 답을 골랐으나 틀린 경우
        else {
          SoundManager.play('wrong');
          hero.style.background = 'var(--md-sys-color-error-container)';
          icon.innerText = '💔';
          text.innerText = '아쉽지만 오답입니다';
          text.style.color = 'var(--md-sys-color-on-error-container)';
        }
        
        hasAnsweredCurrentQ = false;
        document.getElementById('student-score-info').innerText = `현재 누적 점수: ${(me.score || 0).toLocaleString()} pts`;
      });
    }

    function showScreen(screenId) {
      ['student-login', 'student-wait', 'student-quiz', 'student-result'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(screenId).classList.remove('hidden');
    }

    function enableChoices(enable) {
      const buttons = document.querySelectorAll('#student-quiz .m3-choice-card');
      buttons.forEach(btn => {
        btn.style.pointerEvents = enable ? 'auto' : 'none';
        btn.style.opacity = enable ? '1' : '0.6';
      });
    }

    // 창을 닫거나 새로고침할 때 유령 플레이어로 남지 않도록 자동 삭제 예약
    window.addEventListener('beforeunload', () => {
      if (myPlayerId) {
        db.ref(`gameSession/players/${myPlayerId}`).remove();
      }
    });
  </script>
</body>
</html>
