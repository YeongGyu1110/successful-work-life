<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Host Controller</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --md-sys-color-primary: #6750a4;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #eaddff;
      --md-sys-color-on-primary-container: #21005d;
      --md-sys-color-secondary-container: #e8def8;
      --md-sys-color-on-secondary-container: #1d192b;
      --md-sys-color-surface: #fffbfe;
      --md-sys-color-surface-container-low: #f7f2fa;
      --md-sys-color-surface-container: #f3edf7;
      --md-sys-color-surface-container-high: #ece6f0;
      --md-sys-color-surface-container-highest: #e6e0e9;
      --md-sys-color-on-surface: #1c1b1f;
      --md-sys-color-on-surface-variant: #49454f;
      --md-sys-color-outline: #79747e;
      --md-sys-color-outline-variant: #cac4d0;
      --md-sys-color-success: #2e6c43;
      --md-sys-color-success-container: #c4eed0;
      --md-sys-color-on-success-container: #072111;
      --md-elevation-1: 0 1px 3px 1px rgba(0,0,0,0.08), 0 1px 2px 0 rgba(0,0,0,0.12);
      --md-elevation-2: 0 2px 6px 2px rgba(0,0,0,0.10), 0 1px 2px 0 rgba(0,0,0,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    
    body {
      background: radial-gradient(circle at 10% 10%, #f9f5fd 0%, var(--md-sys-color-surface-container) 100%);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .m3-card {
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 28px;
      padding: 36px 32px;
      width: 100%;
      max-width: 600px;
      box-shadow: var(--md-elevation-2);
    }

    .m3-progress-track {
      width: 100%;
      height: 6px;
      background-color: var(--md-sys-color-surface-container-highest);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .m3-progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--md-sys-color-primary);
      border-radius: 999px;
      transition: width 0.4s;
    }

    .display-small { font-size: 32px; font-weight: 700; line-height: 40px; }
    .headline-medium { font-size: 22px; font-weight: 700; }
    .title-medium { font-size: 16px; font-weight: 500; }
    .body-medium { font-size: 14px; color: var(--md-sys-color-on-surface-variant); }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .m3-btn-filled {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border: none;
      border-radius: 20px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      transition: all 0.2s;
    }
    .m3-btn-filled:hover { filter: brightness(1.05); }

    .m3-btn-tonal {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border: none;
      border-radius: 20px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
    }

    .chip-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0;
      min-height: 48px;
    }
    .m3-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--md-sys-color-surface-container-high);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 500;
    }

    .choice-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 24px 0;
    }
    .m3-choice-card {
      position: relative;
      background: var(--md-sys-color-surface-container-low);
      border: 1.5px solid var(--md-sys-color-outline-variant);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      font-size: 16px;
      font-weight: 500;
      overflow: hidden;
      width: 100%;
    }
    .m3-choice-card .prefix-circle {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .m3-choice-card.is-correct {
      background-color: var(--md-sys-color-success-container) !important;
      border-color: var(--md-sys-color-success) !important;
      color: var(--md-sys-color-on-success-container);
    }
    .m3-choice-card.is-correct .prefix-circle {
      background-color: var(--md-sys-color-success) !important;
      color: #ffffff !important;
    }
    .m3-choice-card.is-dimmed { opacity: 0.45; }

    .choice-stat-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: rgba(103, 80, 164, 0.12);
      z-index: 0;
      transition: width 0.6s cubic-bezier(0.2, 0, 0, 1);
    }
    .choice-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      width: 100%;
      justify-content: space-between;
    }

    /* 포디엄 */
    .podium-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 12px;
      margin: 28px 0 24px 0;
      padding: 10px 0;
    }
    .podium-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .podium-column.first-place { order: 2; transform: translateY(-8px); }
    .podium-column.second-place { order: 1; }
    .podium-column.third-place { order: 3; }

    .podium-avatar {
      width: 52px;
      height: 52px;
      border-radius: 26px;
      background: var(--md-sys-color-surface-container-highest);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .first-place .podium-avatar {
      width: 64px;
      height: 64px;
      border-radius: 32px;
      background: var(--md-sys-color-primary-container);
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.5);
    }
    .podium-name {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .podium-score { font-size: 11px; color: var(--md-sys-color-on-surface-variant); margin-bottom: 8px; }
    .podium-pillar {
      width: 100%;
      border-radius: 16px 16px 8px 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
    }
    .first-place .podium-pillar { height: 120px; background: linear-gradient(180deg, #ffd700, #ffbe0b); color: #432800; }
    .second-place .podium-pillar { height: 85px; background: linear-gradient(180deg, #e0e0e0, #bdbdbd); color: #37474f; }
    .third-place .podium-pillar { height: 65px; background: linear-gradient(180deg, #e6b980, #c48b51); color: #3e2723; }

    .leaderboard-list {
      max-height: 180px;
      overflow-y: auto;
      border-radius: 14px;
      background: var(--md-sys-color-surface-container-low);
      padding: 6px 12px;
    }
    .leaderboard-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 6px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      font-size: 14px;
    }
    .leaderboard-row:last-child { border-bottom: none; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="m3-card">
    <div class="header-bar">
      <span class="badge-pill"><span class="material-symbols-outlined">shield_person</span> Host Controller</span>
      <span class="body-medium" id="admin-q-indicator">Lobby</span>
    </div>
    <div class="m3-progress-track">
      <div class="m3-progress-bar" id="admin-progress-bar"></div>
    </div>

    <!-- 타이머 뱃지 -->
    <div id="admin-timer-badge" class="hidden" style="text-align: right; margin-bottom: 12px;">
      <span class="badge-pill" style="background-color: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); font-size: 14px; padding: 6px 16px;">
        <span class="material-symbols-outlined" style="font-size: 18px;">timer</span>
        <span id="admin-timer-text">15s</span>
      </span>
    </div>

    <!-- 1. 호스트 대기 로비 -->
    <div id="admin-lobby">
      <h1 class="display-small" style="margin-bottom: 6px;">Quiz Room</h1>
      <p class="body-medium">플레이어들이 입장할 때까지 대기하세요.</p>
      
      <div style="margin-top: 24px; display: flex; align-items: center; justify-content: space-between;">
        <span class="title-medium">참가자 목록</span>
        <span class="badge-pill" id="admin-joined-count">0명 대기 중</span>
      </div>
      <div class="chip-container" id="admin-player-list">
        <span class="body-medium" style="color: var(--md-sys-color-outline); padding: 8px 0;">아직 입장한 참가자가 없습니다.</span>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button class="m3-btn-filled" style="flex: 1;" onclick="startGame()">
          <span class="material-symbols-outlined">play_arrow</span> 세션 시작하기
        </button>
        <button class="m3-btn-tonal" onclick="resetGame()">
          <span class="material-symbols-outlined">restart_alt</span> 리셋
        </button>
      </div>
    </div>

    <!-- 2. 문제 진행 화면 -->
    <div id="admin-quiz" class="hidden">
      <h2 class="headline-medium" id="admin-question-text" style="margin-bottom: 20px;">문제 타이틀</h2>

      <div class="choice-group">
        <div class="m3-choice-card" id="admin-choice-card-0">
          <div class="choice-stat-bar" id="admin-stat-0" style="width: 0%;"></div>
          <div class="choice-content">
            <div style="display: flex; align-items: center;"><span class="prefix-circle">A</span><span id="admin-c0">Choice 1</span></div>
            <span class="body-medium choice-votes" id="admin-votes-0"></span>
          </div>
        </div>
        <div class="m3-choice-card" id="admin-choice-card-1">
          <div class="choice-stat-bar" id="admin-stat-1" style="width: 0%;"></div>
          <div class="choice-content">
            <div style="display: flex; align-items: center;"><span class="prefix-circle">B</span><span id="admin-c1">Choice 2</span></div>
            <span class="body-medium choice-votes" id="admin-votes-1"></span>
          </div>
        </div>
        <div class="m3-choice-card" id="admin-choice-card-2">
          <div class="choice-stat-bar" id="admin-stat-2" style="width: 0%;"></div>
          <div class="choice-content">
            <div style="display: flex; align-items: center;"><span class="prefix-circle">C</span><span id="admin-c2">Choice 3</span></div>
            <span class="body-medium choice-votes" id="admin-votes-2"></span>
          </div>
        </div>
        <div class="m3-choice-card" id="admin-choice-card-3">
          <div class="choice-stat-bar" id="admin-stat-3" style="width: 0%;"></div>
          <div class="choice-content">
            <div style="display: flex; align-items: center;"><span class="prefix-circle">D</span><span id="admin-c3">Choice 4</span></div>
            <span class="body-medium choice-votes" id="admin-votes-3"></span>
          </div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <span class="body-medium">실시간 응답 현황</span>
        <b class="title-medium" style="color: var(--md-sys-color-primary);" id="admin-submitted-count">0명 제출 완료</b>
      </div>

      <button class="m3-btn-filled" id="btn-next-step" style="width: 100%;" onclick="revealOrNext()">
        <span class="material-symbols-outlined">visibility</span> 정답 및 결과 공개
      </button>
    </div>

    <!-- 3. 포디엄 및 순위표 -->
    <div id="admin-rank" class="hidden">
      <h2 class="display-small" id="admin-rank-title" style="text-align: center;">Leaderboard</h2>

      <div class="podium-container" id="admin-podium"></div>
      <div class="leaderboard-list" id="admin-leaderboard"></div>

      <div style="margin-top: 24px;">
        <button class="m3-btn-filled" id="btn-admin-next-q" style="width: 100%;" onclick="nextQuestion()">
          다음 문제로 이동 <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const SoundManager = {
      bgmLobby: new Audio('대기.mp3'),
      bgmQuiz: new Audio('문제풀이.mp3'),
      bgmWin: new Audio('승리.mp3'),
      sfxMenu: new Audio('메뉴.mp3'),
      sfxCelebrate: new Audio('축하.mp3'),
      winTimer: null,

      init() {
        this.bgmLobby.loop = true; this.bgmLobby.volume = 0.35;
        this.bgmQuiz.loop = true; this.bgmQuiz.volume = 0.4;
        this.bgmWin.volume = 0.6;
      },
      playLobby() { this.stop(); this.bgmLobby.currentTime = 0; this.bgmLobby.play().catch(() => {}); },
      playQuiz() {
        // 로비나 승리 BGM만 정지하고, 퀴즈 BGM은 이미 재생 중이면 유지(끊김/재시작 방지)
        this.bgmLobby.pause();
        this.bgmWin.pause();
        if (this.winTimer) clearTimeout(this.winTimer);
        if (this.bgmQuiz.paused) {
          this.bgmQuiz.play().catch(() => {});
        }
      },
      playWin() { this.stop(); this.bgmWin.currentTime = 0; this.bgmWin.play().catch(() => {}); },
      stop() {
        if (this.winTimer) clearTimeout(this.winTimer);
        this.bgmLobby.pause(); this.bgmQuiz.pause(); this.bgmWin.pause();
      },
      playSfx(type) {
        let s = type === 'menu' ? this.sfxMenu : this.sfxCelebrate;
        if (s) { s.currentTime = 0; s.play().catch(() => {}); }
      }
    };
    SoundManager.init();

    const firebaseConfig = {
      apiKey: "AIzaSyBnCJlp6JA4bEl7a8waxnBoJ8rC106URjE",
      authDomain: "tjdwlr1.firebaseapp.com",
      databaseURL: "https://tjdwlr1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tjdwlr1",
      storageBucket: "tjdwlr1.firebasestorage.app",
      messagingSenderId: "372877966634",
      appId: "1:372877966634:web:5977767092350f289e3253"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let quizData = [];
    let isGameRunning = false; // 게임 진행 중 이탈 방지용 플래그
    let countdownInterval = null; // 타이머 인터벌 변수
    const QUESTION_TIME_LIMIT = 15; // 제한 시간 15초

    // [이탈 방지 경고] 게임 진행 중 실수로 탭 닫기/새로고침 방지
    window.addEventListener('beforeunload', (e) => {
      if (isGameRunning) {
        e.preventDefault();
        e.returnValue = ''; // 표준 브라우저 이탈 경고 팝업 활성화
      }
    });

    // quiz.json 비동기 로드
    fetch('quiz.json')
      .then(res => res.json())
      .then(data => {
        quizData = data;
      })
      .catch(err => console.error("퀴즈 데이터를 불러오지 못했습니다:", err));

    // 첫 클릭 시 로비 BGM 시작
    window.addEventListener('click', () => {
      db.ref('gameSession/state').once('value', snap => {
        if (!snap.val() || snap.val() === 'lobby') SoundManager.playLobby();
      });
    }, { once: true });

    db.ref('gameSession').on('value', snapshot => {
      const data = snapshot.val();
      if (!data) return;

      const players = data.players || {};
      const playerKeys = Object.keys(players);
      const playerListDiv = document.getElementById('admin-player-list');
      const countBadge = document.getElementById('admin-joined-count');

      if (playerKeys.length > 0) {
        countBadge.innerText = `${playerKeys.length}명 대기 중`;
        playerListDiv.innerHTML = Object.values(players)
          .map(p => `<span class="m3-chip"><span class="material-symbols-outlined" style="font-size:16px;">account_circle</span>${p.name}</span>`)
          .join('');
      } else {
        countBadge.innerText = `0명 대기 중`;
        playerListDiv.innerHTML = `<span class="body-medium" style="color: var(--md-sys-color-outline); padding: 8px 0;">아직 입장한 참가자가 없습니다.</span>`;
      }

      if (data.state === 'question') {
        const submittedCount = Object.values(players).filter(p => p.lastAnswer !== undefined && p.lastAnswer !== null).length;
        document.getElementById('admin-submitted-count').innerText = `${submittedCount} / ${playerKeys.length}명 제출 완료`;
      }
    });

    function startGame() {
      if (!quizData || quizData.length === 0) {
        alert("퀴즈 데이터를 아직 불러오는 중이거나 파일이 비어 있습니다.");
        return;
      }
      isGameRunning = true; // 게임 시작 시 이탈 방지 활성화
      SoundManager.playSfx('menu');
      db.ref('gameSession').update({ state: 'question', currentQIndex: 0, reveal: false });
      loadAdminQuestion(0);
    }

    function loadAdminQuestion(idx) {
      SoundManager.playQuiz();

      const q = quizData[idx];
      document.getElementById('admin-lobby').classList.add('hidden');
      document.getElementById('admin-rank').classList.add('hidden');
      document.getElementById('admin-quiz').classList.remove('hidden');

      document.getElementById('admin-q-indicator').innerText = `Question ${idx + 1} of ${quizData.length}`;
      document.getElementById('admin-progress-bar').style.width = `${((idx + 1) / quizData.length) * 100}%`;
      document.getElementById('admin-question-text').innerText = `${idx + 1}. ${q.q}`;
      
      for (let i = 0; i < 4; i++) {
        document.getElementById(`admin-c${i}`).innerText = q.choices[i];
        document.getElementById(`admin-stat-${i}`).style.width = '0%';
        document.getElementById(`admin-votes-${i}`).innerText = '';
        document.getElementById(`admin-choice-card-${i}`).classList.remove('is-correct', 'is-dimmed');
      }

      document.getElementById('btn-next-step').disabled = false;

      /// 문제 출제 시각, 제한 시간, 학생용 선택지를 DB에 전송
      const qStartTime = Date.now();
      db.ref('gameSession').update({
        questionStartTime: qStartTime,
        timeLimit: QUESTION_TIME_LIMIT,
        totalQuestions: quizData.length,
        currentQuestionData: {
          q: q.q,
          choices: q.choices
        }
      });

      // 호스트 15초 타이머 시작
      if (countdownInterval) clearInterval(countdownInterval);
      const timerBadge = document.getElementById('admin-timer-badge');
      const timerText = document.getElementById('admin-timer-text');
      timerBadge.classList.remove('hidden');

      let remaining = QUESTION_TIME_LIMIT;
      timerText.innerText = `${remaining}s`;

      countdownInterval = setInterval(() => {
        remaining--;
        timerText.innerText = `${remaining}s`;
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          revealOrNext(); // 0초가 되면 자동으로 정답 공개 및 마감
        }
      }, 1000);

      // 이전 라운드 플레이어 응답값 초기화
      db.ref('gameSession/players').once('value', snap => {
        const players = snap.val() || {};
        Object.keys(players).forEach(k => {
          db.ref(`gameSession/players/${k}`).update({
            lastAnswer: null,
            submittedAt: null,
            roundEarnedScore: 0
          });
        });
      });
    }

    function revealOrNext() {
      // 타이머 즉시 정지 및 뱃지 숨김
      if (countdownInterval) clearInterval(countdownInterval);
      document.getElementById('admin-timer-badge').classList.add('hidden');

      db.ref('gameSession').once('value', snap => {
        const data = snap.val();
        if (!data) return;

        const currentIdx = data.currentQIndex || 0;
        const correctAns = quizData[currentIdx].ans;
        const players = data.players || {};
        const totalParticipants = Object.keys(players).length;

        const voteCounts = [0, 0, 0, 0];
        Object.keys(players).forEach(pid => {
          const p = players[pid];
          if (p && p.lastAnswer !== null && p.lastAnswer !== undefined) {
            voteCounts[p.lastAnswer] = (voteCounts[p.lastAnswer] || 0) + 1;
          }
          if (p && p.lastAnswer === correctAns) {
            // [스피드 점수 계산] 15초 제한시간 기준: 0초에 누르면 1,000점 / 15초 경과 시 최소 500점 보장
            const qStart = data.questionStartTime || (p.submittedAt ? p.submittedAt - 1000 : Date.now());
            const submitTime = p.submittedAt || qStart;
            const elapsedSeconds = Math.max(0, (submitTime - qStart) / 1000);
            const timeLimit = QUESTION_TIME_LIMIT; // 15초 기준

            // 500점(기본) + 남은 시간에 비례한 보너스(최대 500점)
            const speedRatio = Math.max(0, (timeLimit - elapsedSeconds) / timeLimit);
            const earnedScore = Math.round(500 + (500 * speedRatio));

            const newScore = (p.score || 0) + earnedScore;
            db.ref(`gameSession/players/${pid}`).update({
              score: newScore,
              roundEarnedScore: earnedScore // 이번 라운드 획득 점수 저장
            });
            p.score = newScore;
          }
        });

        for (let i = 0; i < 4; i++) {
          const card = document.getElementById(`admin-choice-card-${i}`);
          const percent = totalParticipants > 0 ? (voteCounts[i] / totalParticipants) * 100 : 0;
          document.getElementById(`admin-stat-${i}`).style.width = `${percent}%`;
          document.getElementById(`admin-votes-${i}`).innerText = `${voteCounts[i]}표 (${Math.round(percent)}%)`;

          if (i === correctAns) card.classList.add('is-correct');
          else card.classList.add('is-dimmed');
        }

        db.ref('gameSession').update({ reveal: true, state: 'reveal' });
        document.getElementById('btn-next-step').disabled = true;

        setTimeout(() => showLeaderboard(players, currentIdx), 2400);
      });
    }

    function showLeaderboard(players, currentIdx) {
      document.getElementById('admin-quiz').classList.add('hidden');
      document.getElementById('admin-rank').classList.remove('hidden');

      const isLast = currentIdx >= quizData.length - 1;
      const nextBtn = document.getElementById('btn-admin-next-q');
      const title = document.getElementById('admin-rank-title');

      // 1. 공정한 정렬: 1순위 점수(높은순) -> 2순위 제출 속도(빠른순)
      const sorted = Object.values(players || {})
        .filter(p => p && typeof p === 'object' && p.name)
        .sort((a, b) => {
          const scoreDiff = (b.score || 0) - (a.score || 0);
          if (scoreDiff !== 0) return scoreDiff;
          // 동점인 경우: 더 일찍 제출한 사람 우선 (제출 기록 없으면 후순위)
          const timeA = a.submittedAt || Infinity;
          const timeB = b.submittedAt || Infinity;
          return timeA - timeB;
        });

      if (isLast) {
        title.innerText = "🏆 Final Podium";
        nextBtn.innerHTML = `세션 종료하기 <span class="material-symbols-outlined">check_circle</span>`;
        SoundManager.stop();
        SoundManager.playSfx('celebrate');
        if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 80, origin: { y: 0.6 } });
        SoundManager.winTimer = setTimeout(() => SoundManager.playWin(), 7500);
      } else {
        title.innerText = "Current Standings";
        nextBtn.innerHTML = `다음 문제로 이동 <span class="material-symbols-outlined">arrow_forward</span>`;
      }

      const podiumEl = document.getElementById('admin-podium');
      const listEl = document.getElementById('admin-leaderboard');
      podiumEl.innerHTML = '';
      listEl.innerHTML = '';

      // 참가자가 아예 없는 극단적인 예외 상황
      if (sorted.length === 0) {
        podiumEl.innerHTML = `<div class="body-medium" style="padding: 20px; color: var(--md-sys-color-outline);">참가자가 없습니다.</div>`;
        return;
      }

      // 2. 포디엄 렌더링 (undefined 방어: 안전 접근 연산자 및 기본값 적용)
      const top1 = sorted[0];
      const top2 = sorted[1];
      const top3 = sorted[2];

      if (top1) {
        podiumEl.innerHTML += `
          <div class="podium-column first-place">
            <div class="podium-avatar">👑</div>
            <div class="podium-name">${top1.name || '무명'}</div>
            <div class="podium-score">${(top1.score || 0).toLocaleString()} pts</div>
            <div class="podium-pillar">1</div>
          </div>
        `;
      }
      if (top2) {
        podiumEl.innerHTML += `
          <div class="podium-column second-place">
            <div class="podium-avatar">🥈</div>
            <div class="podium-name">${top2.name || '무명'}</div>
            <div class="podium-score">${(top2.score || 0).toLocaleString()} pts</div>
            <div class="podium-pillar">2</div>
          </div>
        `;
      }
      if (top3) {
        podiumEl.innerHTML += `
          <div class="podium-column third-place">
            <div class="podium-avatar">🥉</div>
            <div class="podium-name">${top3.name || '무명'}</div>
            <div class="podium-score">${(top3.score || 0).toLocaleString()} pts</div>
            <div class="podium-pillar">3</div>
          </div>
        `;
      }

      // 3. 4위 이하 리스트 안전 출력
      const restPlayers = sorted.slice(3);
      if (restPlayers.length === 0) {
        listEl.innerHTML = `<div class="body-medium" style="text-align:center; padding: 12px; color:var(--md-sys-color-outline);">모든 참가자의 순위가 상단에 표시되었습니다.</div>`;
      } else {
        listEl.innerHTML = restPlayers.map((p, idx) => `
          <div class="leaderboard-row">
            <div>
              <span style="font-weight:700; width:28px; display:inline-block;">#${idx + 4}</span>
              <span>${p.name || '무명'}</span>
            </div>
            <b>${(p.score || 0).toLocaleString()} pts</b>
          </div>
        `).join('');
      }
    }

    function nextQuestion() {
      SoundManager.playSfx('menu');
      db.ref('gameSession').once('value', snap => {
        const nextIdx = (snap.val()?.currentQIndex || 0) + 1;
        if (nextIdx < quizData.length) {
          db.ref('gameSession').update({ state: 'question', currentQIndex: nextIdx, reveal: false });
          loadAdminQuestion(nextIdx);
        } else {
          alert('모든 퀴즈가 완료되었습니다.');
          resetGame();
        }
      });
    }

    function resetGame() {
      isGameRunning = false; // 리셋 시 경고창 없이 새로고침되도록 해제
      if (countdownInterval) clearInterval(countdownInterval);
      SoundManager.stop();
      SoundManager.bgmQuiz.currentTime = 0;
      
      // players를 완전히 null로 지워 찌꺼기 데이터가 남지 않도록 함
      db.ref('gameSession').set({
        state: 'lobby',
        currentQIndex: 0,
        reveal: false,
        players: null
      }).then(() => {
        location.reload();
      });
    }
  </script>
