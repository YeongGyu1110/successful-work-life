<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>직업 기초 능력 딜레마 토론</title>
  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!-- Firebase v9 (Compat) CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --md-sys-color-primary: #00639b;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #cee5ff;
      --md-sys-color-on-primary-container: #001d33;
      --md-sys-color-surface: #f8f9ff;
      --md-sys-color-on-surface: #191c20;
      --md-sys-color-surface-container: #edf0f7;
      --md-sys-color-outline: #72777f;
      --md-sys-color-outline-variant: #c2c7cf;
      --md-sys-color-error: #ba1a1a;
      --md-sys-shape-corner-small: 8px;
      --md-sys-shape-corner-medium: 16px;
      --md-sys-shape-corner-large: 24px;
      --md-sys-shape-corner-full: 9999px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* 학생 화면은 좁고 집중도 있게, 발표자 화면은 넓게 */
    .container { width: 100%; max-width: 680px; margin: auto; }
    .container-wide { max-width: 1000px !important; }

    .card {
      background: #ffffff;
      border-radius: var(--md-sys-shape-corner-large);
      padding: 24px 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      border: 1px solid var(--md-sys-color-outline-variant);
      margin-bottom: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--md-sys-shape-corner-full);
      font-size: 15px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary { background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:disabled { background-color: var(--md-sys-color-outline-variant); cursor: not-allowed; }
    .btn-text-danger { background: transparent; color: var(--md-sys-color-error); font-size: 13px; padding: 6px 12px; }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--md-sys-shape-corner-full);
      font-size: 12px;
      font-weight: 700;
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      margin-bottom: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-corner-full);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-bar { height: 100%; width: 0%; background: var(--md-sys-color-primary); transition: width 0.3s ease; }

    .option-card {
      border: 2px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium);
      padding: 16px 18px;
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }
    .option-card:hover { background-color: var(--md-sys-color-surface-container); }
    .option-card.selected {
      border-color: var(--md-sys-color-primary);
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-weight: 500;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: var(--md-sys-shape-corner-small);
      font-size: 15px;
      margin-top: 8px;
      margin-bottom: 20px;
      outline: none;
    }

    /* --- [발표자 대시보드 전용 스타일] --- */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: #fff;
      padding: 16px 20px;
      border-radius: var(--md-sys-shape-corner-large);
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
      gap: 20px;
    }
    @media (max-width: 600px) {
      .dashboard-grid { grid-template-columns: 1fr; }
    }
    .chart-box {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-corner-medium);
      padding: 14px 16px;
      margin-top: 14px;
    }
    .chart-item { margin-bottom: 12px; }
    .chart-item:last-child { margin-bottom: 0; }
    .chart-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .chart-track {
      background: #ffffff;
      height: 18px;
      border-radius: var(--md-sys-shape-corner-full);
      overflow: hidden;
      border: 1px solid var(--md-sys-color-outline-variant);
    }
    .chart-fill {
      height: 100%;
      background: var(--md-sys-color-primary);
      width: 0%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .insight-box {
      background: #f0f7ff;
      border-left: 3px solid var(--md-sys-color-primary);
      border-radius: 4px;
      padding: 10px 12px;
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.5;
      color: #333;
    }
  </style>
</head>
<body>

  <div id="main-container" class="container">
    <!-- 1. 학생용 뷰 -->
    <div id="student-view">
      <!-- 닉네임 입력 화면 -->
      <div id="step-intro" class="card">
        <span class="badge">수업 참여 설문</span>
        <h2 style="font-size: 22px; margin-bottom: 8px;">직업 기초 능력 딜레마 토론</h2>
        <p style="color: #555; font-size: 14px; line-height: 1.5; margin-bottom: 20px;">
          실제 직업 현장의 5가지 갈등 상황입니다. 정답은 없습니다. 여러분의 생각을 솔직하게 선택해 주세요!
        </p>
        <label style="font-size: 13px; font-weight: 500;">학번 / 닉네임</label>
        <input type="text" id="user-nickname" class="input-field" placeholder="예: 20415 김철수" autocomplete="off">
        <button class="btn btn-primary" style="width: 100%;" onclick="startSurvey()">시작하기</button>
      </div>

      <!-- 문제 풀이 화면 -->
      <div id="step-questions" class="card" style="display: none;">
        <div class="progress-bar-container">
          <div id="survey-progress" class="progress-bar"></div>
        </div>
        <span id="question-badge" class="badge">딜레마 1</span>
        <h3 id="question-title" style="margin-bottom: 10px; font-size: 18px; line-height: 1.4;"></h3>
        <p id="question-desc" style="font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 20px;"></p>

        <div id="options-container"></div>

        <div style="display: flex; justify-content: flex-end; margin-top: 20px;">
          <button id="btn-next" class="btn btn-primary" onclick="submitCurrentAnswerAndNext()" disabled>
            다음으로 <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </div>
      </div>

      <!-- 완료 화면 -->
      <div id="step-completed" class="card" style="display: none; text-align: center; padding: 40px 20px;">
        <span class="material-symbols-outlined" style="font-size: 52px; color: #2e7d32; margin-bottom: 14px;">check_circle</span>
        <h2 style="font-size: 20px; margin-bottom: 8px;">모든 응답이 완료되었습니다!</h2>
        <p style="color: #666; font-size: 14px; line-height: 1.6;">
          선택하신 내용이 실시간 집계에 반영되었습니다.<br>
          이제 앞쪽 스크린을 보고 반 친구들과 함께 결과를 확인해 보세요.
        </p>
      </div>
    </div>

    <!-- 2. 발표자용 뷰 (?mode=admin) : 전체 문제 한눈에 보기 -->
    <div id="admin-view" style="display: none;">
      <div class="admin-header">
        <div>
          <span class="badge" style="margin-bottom: 4px;">실시간 집계 대시보드</span>
          <h2 style="font-size: 20px;">전체 딜레마 투표 현황</h2>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="font-size: 14px; background: var(--md-sys-color-surface-container); padding: 8px 14px; border-radius: var(--md-sys-shape-corner-full);">
            실시간 참여자: <strong id="admin-participant-count" style="color: var(--md-sys-color-primary);">0</strong>명
          </div>
          <button class="btn btn-text-danger" onclick="resetSurveyData()">데이터 초기화</button>
        </div>
      </div>

      <!-- 5개 문제가 한눈에 나열되는 그리드 -->
      <div id="dashboard-grid" class="dashboard-grid"></div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       [Firebase 설정 및 초기화]
       ⚠️ 아래 firebaseConfig 객체를 본인 Firebase 콘솔 값으로 붙여넣으세요!
       ========================================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyBnCJlp6JA4bEl7a8waxnBoJ8rC106URjE",
      authDomain: "tjdwlr1.firebaseapp.com",
      databaseURL: "https://tjdwlr1-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tjdwlr1",
      storageBucket: "tjdwlr1.firebasestorage.app",
      messagingSenderId: "372877966634",
      appId: "1:372877966634:web:5977767092350f289e3253"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const surveysRef = db.ref('career_surveys');

    /* ==========================================================================
       문항 데이터셋 (5개 문항)
       ========================================================================== */
    const dilemmas = [
      {
        id: 1,
        competency: "직업 윤리 (근로/공동체 윤리)",
        title: "신호 위반한 동창 단속 딜레마 (교과서 59p)",
        desc: "경찰관이 된 당신. 신호 위반 차량을 단속했는데 고등학교 절친이 운전자석에서 '이번 한 번만 봐달라'며 사정합니다.",
        options: [
          "원칙대로 단호하게 범칙금 스티커를 발부한다.",
          "친한 친구의 사정을 봐주어 구두 경고만 하고 보낸다."
        ],
        insight: "공과 사의 엄격한 구분과 사회적 신뢰 형성. 개인적 유대감보다 공동체의 안전 규칙 준수가 직업인의 기본 책무입니다."
      },
      {
        id: 2,
        competency: "수리 및 기술·정보 능력",
        title: "탐사선 발사 직전 단위 오차 의심 (교과서 56p)",
        desc: "NASA 탐사선 발사 1시간 전, 단위(m와 yd) 계산 오차가 의심됩니다. 중단 시 수백억 원의 위약금이 발생합니다.",
        options: [
          "막대한 손해를 감수하더라도 발사를 즉시 중단하고 재검증한다.",
          "시스템 보정 확률을 믿고 예정대로 카운트다운을 진행한다."
        ],
        insight: "수리 능력의 정확성. 1999년 NASA는 야드/미터 혼동으로 1,300억 원의 탐사선이 폭발하는 참사를 겪었습니다."
      },
      {
        id: 3,
        competency: "자기 개발 능력 (경력 개발)",
        title: "사라지는 치즈와 AI 도입 (교과서 57p)",
        desc: "내 업무 기술이 새로운 생성형 AI로 대체되기 시작했습니다. 현재 맡은 자리는 당장 안정적입니다.",
        options: [
          "기존 노하우를 극대화하며 현재 방식의 전문성을 더 판다.",
          "기득권을 내려놓고 불확실하더라도 새로운 AI 툴 학습에 올인한다."
        ],
        insight: "《누가 내 치즈를 옮겼을까?》처럼 변화에 안주하지 않고 스스로를 지속 발전시키는 자기 개발 능력입니다."
      },
      {
        id: 4,
        competency: "대인 관계 능력 (팀워크/갈등 관리)",
        title: "무임승차 조원 명단 제외 딜레마",
        desc: "과제 내내 연락을 피하던 조원이 발표 전날 밤 '이름만 넣어주면 밥을 사겠다'며 사정합니다.",
        options: [
          "공정한 기여 원칙에 따라 최종 보고서에서 이름을 제외한다.",
          "팀 분위기와 인간관계를 고려해 이번에는 이름을 올려준다."
        ],
        insight: "협업은 무조건적인 양보가 아닌, 공정한 역할 분담과 규칙 준수(갈등 조정)를 바탕으로 지속됩니다."
      },
      {
        id: 5,
        competency: "자원 관리 능력 (시간/품질)",
        title: "마감 시한 vs 완벽한 완성도",
        desc: "보고서 제출 30분 전, 완성도를 더 높이고 싶지만 기한을 어기면 신뢰에 치명적입니다.",
        options: [
          "약속된 기한 준수가 최우선이므로 현재 상태로 정시에 제출한다.",
          "품질 부족은 무의미하므로 지연을 감수하고 완성도를 높여 제출한다."
        ],
        insight: "한정된 시간과 예산 속에서 우선순위를 정하고 목표를 완수하는 시간/자원 관리 능력입니다."
      }
    ];

    /* ==========================================================================
       애플리케이션 상태
       ========================================================================== */
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('mode') === 'admin';

    let currentStep = 0;
    let currentUserKey = null; // 학생마다 고유하게 생성되는 세션 키
    let selectedOptionForCurrentQuestion = null;
    let liveResponses = [];

    window.addEventListener('DOMContentLoaded', () => {
      if (isAdmin) {
        document.getElementById('student-view').style.display = 'none';
        document.getElementById('admin-view').style.display = 'block';
        document.getElementById('main-container').classList.add('container-wide');
        initAdminDashboard();
      } else {
        document.getElementById('student-view').style.display = 'block';
        document.getElementById('admin-view').style.display = 'none';
      }
    });

    /* --- [학생용 로직: 문제 풀 때마다 즉시 실시간 저장] --- */
    function startSurvey() {
      const input = document.getElementById('user-nickname');
      const nickname = input.value.trim();
      if (!nickname) {
        alert("학번이나 닉네임을 입력해 주세요!");
        input.focus();
        return;
      }

      // 학생 접속 시 고유 key를 발급받고 기본 정보 즉시 저장
      const newRef = surveysRef.push();
      currentUserKey = newRef.key;
      newRef.set({
        nickname: nickname,
        timestamp: Date.now(),
        answers: {}
      });

      document.getElementById('step-intro').style.display = 'none';
      document.getElementById('step-questions').style.display = 'block';
      renderQuestion(0);
    }

    function renderQuestion(index) {
      currentStep = index;
      selectedOptionForCurrentQuestion = null;
      const d = dilemmas[index];

      const progressPercent = (index / dilemmas.length) * 100;
      document.getElementById('survey-progress').style.width = `${progressPercent}%`;
      document.getElementById('question-badge').innerText = `딜레마 ${index + 1} / ${dilemmas.length}`;
      document.getElementById('question-title').innerText = d.title;
      document.getElementById('question-desc').innerText = d.desc;

      const container = document.getElementById('options-container');
      container.innerHTML = "";

      d.options.forEach((optText, optIdx) => {
        const optCard = document.createElement('div');
        optCard.className = 'option-card';
        optCard.innerHTML = `
          <span class="material-symbols-outlined" style="font-size: 20px; color: var(--md-sys-color-outline);">radio_button_unchecked</span>
          <span>${optText}</span>
        `;
        optCard.onclick = () => {
          document.querySelectorAll('.option-card').forEach(c => {
            c.classList.remove('selected');
            c.querySelector('.material-symbols-outlined').innerText = 'radio_button_unchecked';
          });
          optCard.classList.add('selected');
          optCard.querySelector('.material-symbols-outlined').innerText = 'radio_button_checked';
          selectedOptionForCurrentQuestion = optIdx;
          document.getElementById('btn-next').disabled = false;
        };
        container.appendChild(optCard);
      });

      document.getElementById('btn-next').disabled = true;
    }

    // 다음 버튼 클릭 시 -> 즉시 Firebase에 이 문제의 답을 기록!
    function submitCurrentAnswerAndNext() {
      if (selectedOptionForCurrentQuestion === null || !currentUserKey) return;

      const qId = dilemmas[currentStep].id;
      // 실시간으로 이 질문의 답변을 RTDB에 기록 (비동기 처리로 딜레이 없음)
      surveysRef.child(`${currentUserKey}/answers/${qId}`).set(selectedOptionForCurrentQuestion);

      if (currentStep < dilemmas.length - 1) {
        renderQuestion(currentStep + 1);
      } else {
        document.getElementById('step-questions').style.display = 'none';
        document.getElementById('step-completed').style.display = 'block';
      }
    }

    /* --- [발표자(Admin) 로직: 전체 문제 한눈에 보기] --- */
    function initAdminDashboard() {
      buildDashboardUI();

      // Firebase 실시간 리스너 연결
      surveysRef.on('value', (snapshot) => {
        const data = snapshot.val();
        liveResponses = data ? Object.values(data) : [];
        document.getElementById('admin-participant-count').innerText = liveResponses.length;
        updateDashboardCharts();
      });
    }

    // 대시보드 뼈대(5개 카드) 생성
    function buildDashboardUI() {
      const grid = document.getElementById('dashboard-grid');
      grid.innerHTML = "";

      dilemmas.forEach((d) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.marginBottom = '0';
        card.innerHTML = `
          <span class="badge">${d.competency}</span>
          <h3 style="font-size: 16px; margin-bottom: 6px;">Q${d.id}. ${d.title}</h3>
          <p style="font-size: 13px; color: #666; line-height: 1.4;">${d.desc}</p>
          
          <div class="chart-box" id="chart-box-${d.id}">
            <!-- 실시간 바 차트 들어가는 곳 -->
          </div>

          <div class="insight-box">
            <strong>💡 역량 포인트:</strong> ${d.insight}
          </div>
        `;
        grid.appendChild(card);
      });

      updateDashboardCharts();
    }

    // 실시간 데이터 변경 시 5개 문제의 바 차트 즉각 갱신
    function updateDashboardCharts() {
      dilemmas.forEach((d) => {
        const box = document.getElementById(`chart-box-${d.id}`);
        if (!box) return;

        // 해당 문제의 응답 집계
        const counts = [0, 0];
        liveResponses.forEach(r => {
          if (r.answers && r.answers[d.id] !== undefined) {
            const choice = r.answers[d.id];
            if (counts[choice] !== undefined) counts[choice]++;
          }
        });

        const total = counts[0] + counts[1];
        box.innerHTML = "";

        d.options.forEach((optText, i) => {
          const count = counts[i];
          const percent = total > 0 ? Math.round((count / total) * 100) : 0;

          const item = document.createElement('div');
          item.className = 'chart-item';
          item.innerHTML = `
            <div class="chart-label">
              <span style="max-width: 78%; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;">
                <strong>${i + 1}.</strong> ${optText}
              </span>
              <span><strong>${percent}%</strong> (${count}명)</span>
            </div>
            <div class="chart-track">
              <div class="chart-fill" style="width: ${percent}%"></div>
            </div>
          `;
          box.appendChild(item);
        });
      });
    }

    // 데이터 초기화
    function resetSurveyData() {
      if (confirm("모든 투표 데이터를 초기화하시겠습니까?")) {
        surveysRef.remove().then(() => {
          alert("데이터가 깨끗하게 초기화되었습니다.");
        });
      }
    }
  </script>
</body>
</html>
